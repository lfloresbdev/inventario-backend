spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Flyway se auto-activa al estar en el classpath. Las migraciones son DDL de
  # PostgreSQL, así que sólo se habilitan en prod; dev usa H2 con ddl-auto: update.
  flyway:
    enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000
  encrypt:
    secret: ${ENCRYPT_SECRET}
  seed:
    admin-password: ${SEED_ADMIN_PASSWORD}
    user-password: ${SEED_USER_PASSWORD}
  cookie:
    secure: ${COOKIE_SECURE:false}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
