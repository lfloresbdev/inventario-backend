spring:
  # Flyway construye el esquema y Hibernate lo valida después (Spring Boot
  # garantiza ese orden). Nunca poner ddl-auto distinto de validate aquí.
  flyway:
    enabled: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      keepalive-time: 300000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  h2:
    console:
      enabled: false

app:
  cookie:
    secure: true
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
