spring:
  datasource:
    url: jdbc:h2:mem:empleadodb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-replace-in-production-32c}
    expiration: 86400000
  encrypt:
    secret: ${ENCRYPT_SECRET:dev-only-encrypt-key-replace-in-production}
  seed:
    admin-password: ${SEED_ADMIN_PASSWORD:admin123}
    user-password: ${SEED_USER_PASSWORD:user123}
  cookie:
    secure: false
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}
